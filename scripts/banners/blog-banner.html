<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1408px; height: 768px; overflow: hidden; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #0f172a;
    background: linear-gradient(#f3f3f1 0%, #eeeeec 68%, #e4e4e1 68%, #e9e9e6 100%);
    position: relative;
  }
  .head { position: absolute; top: 34px; left: 0; right: 0; text-align: center; }
  .h1 { font-size: 66px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.05; }
  .h2 { font-size: 34px; font-weight: 400; margin-top: 10px; color: #1e293b; }
  .h3 { font-size: 21px; font-weight: 700; letter-spacing: 2px; margin-top: 12px; text-transform: uppercase; color: #334155; }

  .receipt {
    position: absolute; left: 50%; top: 248px; transform: translateX(-50%);
    width: 400px; background: #fff; border-radius: 6px;
    box-shadow: 0 18px 40px rgba(15,23,42,.14), 0 2px 6px rgba(15,23,42,.08);
    padding: 22px 26px 18px; font-family: Menlo, monospace; font-size: 14.5px; color: #1f2937;
  }
  .r-title { text-align: center; font-weight: 700; font-size: 17px; letter-spacing: 1px; }
  .r-sub { text-align: center; font-size: 12.5px; color: #64748b; margin-top: 3px; }
  .r-rule { border-top: 1px dashed #94a3b8; margin: 12px 0 10px; }
  .r-row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .r-row span:last-child { text-align: right; }
  .r-total { background: #ccf3e3; margin: 8px -10px 0; padding: 7px 10px; font-weight: 700; border-radius: 4px; }
  .r-foot { text-align: center; font-size: 12.5px; color: #64748b; margin-top: 10px; }
  .receipt.has-stamp { padding-bottom: 86px; }
  .receipt.has-stamp .r-foot { text-align: left; margin-top: 46px; }
  .stamp {
    position: absolute; right: 26px; bottom: 14px; width: 58px; height: 66px;
    background: repeating-linear-gradient(45deg, #fde68a 0 4px, #fcd34d 4px 8px);
    border: 3px dotted #b45309; border-radius: 3px; font-family: "Helvetica Neue", sans-serif;
    font-size: 11px; font-weight: 800; color: #92400e; text-align: center; padding-top: 14px; line-height: 1.2;
  }
  .stamp .sig { position: absolute; left: -16px; top: 22px; font-family: "Bradley Hand", cursive; font-size: 22px; color: #1e3a8a; transform: rotate(-12deg); white-space: nowrap; }

  /* Lift the props' grey studio backdrop to the banner tone, then multiply so
     only the object and its contact shadow remain visible. */
  .prop { position: absolute; object-fit: cover; mix-blend-mode: multiply;
    filter: brightness(1.22) contrast(1.08);
    -webkit-mask-image: radial-gradient(circle at 50% 55%, #000 46%, transparent 66%);
            mask-image: radial-gradient(circle at 50% 55%, #000 46%, transparent 66%); }
  .prop.left { left: 40px; top: 238px; width: 400px; height: 400px; }
  .prop.right { right: 70px; top: 300px; width: 280px; height: 280px; }

  .note { position: absolute; font-family: "Bradley Hand", "Snell Roundhand", cursive; font-size: 34px; color: #111827; line-height: 1.05; text-align: center; }
  svg.arrow { position: absolute; overflow: visible; }

  .pills { position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 64px; }
  .pill { background: #fff; border-radius: 999px; padding: 15px 34px; font-size: 25px; font-weight: 800; letter-spacing: .5px;
    box-shadow: 0 4px 14px rgba(15,23,42,.10); text-transform: uppercase; }
</style>
</head>
<body>
<div class="head">
  <div class="h1" id="h1"></div>
  <div class="h2" id="h2"></div>
  <div class="h3" id="h3"></div>
</div>
<img class="prop left" id="propL">
<img class="prop right" src="props/prop-4.png">
<div class="receipt" id="receipt"></div>
<div class="note" id="noteL" style="left: 150px; top: 205px;"></div>
<div class="note" id="noteR" style="right: 64px; top: 228px;"></div>
<svg class="arrow" style="left: 300px; top: 262px;" width="120" height="60"><path d="M10 10 C 50 10, 80 30, 108 48" fill="none" stroke="#111827" stroke-width="2.5"/><path d="M96 48 L109 49 L104 37" fill="none" stroke="#111827" stroke-width="2.5"/></svg>
<svg class="arrow" style="right: 300px; top: 300px;" width="120" height="60"><path d="M110 10 C 70 10, 40 30, 12 48" fill="none" stroke="#111827" stroke-width="2.5"/><path d="M24 48 L11 49 L16 37" fill="none" stroke="#111827" stroke-width="2.5"/></svg>
<div class="pills" id="pills"></div>

<script>
const BANNERS = [
  {
    h1: "Dependent Care FSA Receipts", h2: "What Your Provider Must Include", h3: "Name, address, tax ID, dates, amount.",
    prop: "props/prop-0.png", noteL: "Claim-<br>Ready", noteR: "Keep for<br>Form 2441",
    pills: ["Provider ID", "Dates of care", "Amount paid"],
    currency: "$",
    title: "Little Oaks Daycare", sub: "Provider TIN: XX-XXX0000",
    info: [["Address", "12 Elm Street, Austin, TX"], ["Child", "Mia R."], ["Care", "Oct 1–31, 2026"]],
    lines: [["Full-day childcare, October", 1250.00]],
    totalLabel: "TOTAL PAID", foot: "Signed: ______________",
  },
  {
    h1: "Rent Receipt for HRA", h2: "Format, Revenue Stamp & Landlord PAN", h3: "What your employer will check.",
    prop: "props/prop-1.png", noteL: "Old Regime<br>Only", noteR: "PAN above<br>₹1 lakh/yr",
    pills: ["Tenant & landlord", "Rent period", "PAN & stamp"],
    currency: "₹",
    title: "RENT RECEIPT", sub: "Landlord PAN: XXXXX0000X",
    info: [["Received from", "Priya Sharma"], ["Paid", "In cash, 01/10/2026"]],
    lines: [["Rent for October 2026", 18000]],
    totalLabel: "TOTAL", foot: "Landlord's signature", stamp: true,
  },
  {
    h1: "StockX Receipt", h2: "How to Find Yours, and How to Make One", h3: "Buying › History › Order details.",
    prop: "props/prop-2b.png", noteL: "Official<br>Record", noteR: "Fees<br>Add Up",
    pills: ["Size & style", "Fees shown", "Order number"],
    currency: "$",
    title: "ORDER DETAILS", sub: "Order #00000000-0000",
    info: [["Item", "High-Top Sneaker"], ["Size", "US M 10"], ["Style", "DZ5485-612"]],
    lines: [["Item price", 248.00], ["Processing fee", 7.44], ["Shipping", 14.95]],
    totalLabel: "TOTAL", foot: "Confirmation emailed to buyer",
  },
  {
    h1: "Ontario Rent Receipts", h2: "What Landlords Must Provide", h3: "Free on request. Four fields required.",
    prop: "props/prop-3.png", noteL: "Ask<br>Anytime", noteR: "Keep for<br>Trillium",
    pills: ["Unit address", "Tenant names", "Amount & date"],
    currency: "CA$",
    title: "RENT RECEIPT", sub: "Unit 1204, 88 Harbour Lane, Toronto",
    info: [["Tenants", "Alex Chen, Sam Okafor"], ["Received", "Oct 1, 2026"]],
    lines: [["Rent for October 2026", 2150.00]],
    totalLabel: "TOTAL", foot: "Paid via e-Transfer",
  },
  {
    h1: "How to Make a Mechanic Receipt", h2: "Parts, Labor, Payment", h3: "Vehicle. Parts. Labor. How it was paid.",
    prop: "props/prop-5.png", noteL: "Number<br>Every Job", noteR: "Parts and Labor<br>Apart",
    pills: ["Vehicle & mileage", "Parts & labor", "Payment method"],
    currency: "$",
    title: "Ridge Road Auto Repair", sub: "Receipt #2026-0147",
    info: [["Vehicle", "2019 Honda Civic"], ["Mileage", "61,240 mi"]],
    // Tax applies to the parts line only, so it is typed: 8.25% of $89.00 = $7.34.
    lines: [["Front brake pads", 89.00], ["Labor 1.5 hr @ $95", 142.50], ["Shop supplies", 12.00], ["Tax on parts 8.25%", 7.34]],
    totalLabel: "TOTAL PAID", foot: "Paid by card · Customer copy",
  },
  {
    h1: "Oil Change Receipt", h2: "What It Shows and How to Make One", h3: "Date. Mileage. Oil. Next service.",
    prop: "props/prop-6.png", noteL: "Write the<br>Miles", noteR: "Warranty<br>Proof",
    pills: ["Mileage", "Oil & filter", "Next service"],
    currency: "$",
    title: "Express Lube & Tire", sub: "2210 Commerce Street, Dallas, TX",
    info: [["Date", "Oct 9, 2026"], ["Vehicle", "2021 Toyota Camry"], ["Odometer", "42,850 mi"], ["Next due", "47,850 mi"]],
    // Same sample as /templates/oil-change-receipt; tax is 8.25% of the $86.43 subtotal = $7.13.
    lines: [["0W-20 synthetic, 5 qt", 44.95], ["Oil filter", 12.99], ["Labor", 24.99], ["Disposal fee", 3.50], ["Sales tax 8.25%", 7.13]],
    totalLabel: "TOTAL", foot: "Keep for your service history",
  },
];

const b = BANNERS[Number(new URLSearchParams(location.search).get("p") || 0)];
const money = (n) => b.currency + n.toLocaleString(b.currency === "₹" ? "en-IN" : "en-US",
  { minimumFractionDigits: b.currency === "₹" ? 0 : 2, maximumFractionDigits: 2 });
// The total is summed from the visible lines, never typed (pin pipeline rule).
const total = b.lines.reduce((s, [, v]) => s + v, 0);

document.getElementById("h1").textContent = b.h1;
document.getElementById("h2").textContent = b.h2;
document.getElementById("h3").textContent = b.h3;
document.getElementById("propL").src = b.prop;
document.getElementById("noteL").innerHTML = b.noteL;
document.getElementById("noteR").innerHTML = b.noteR;
document.getElementById("pills").innerHTML = b.pills.map((p) => `<div class="pill">${p}</div>`).join("");
const row = (l, r) => `<div class="r-row"><span>${l}</span><span>${r}</span></div>`;
if (b.stamp) document.getElementById("receipt").classList.add("has-stamp");
document.getElementById("receipt").innerHTML =
  `<div class="r-title">${b.title}</div><div class="r-sub">${b.sub}</div><div class="r-rule"></div>` +
  b.info.map(([l, r]) => row(l, r)).join("") + `<div class="r-rule"></div>` +
  b.lines.map(([l, v]) => row(l, money(v))).join("") +
  `<div class="r-row r-total"><span>${b.totalLabel}</span><span>${money(total)}</span></div>` +
  `<div class="r-foot">${b.foot}</div>` +
  (b.stamp ? `<div class="stamp">₹1<br>REVENUE<span class="sig">R. Kumar</span></div>` : "");
</script>
</body>
</html>
